name: Deploy Bot to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bot .

      - name: Copy binary to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 9049
          source: "bot"
          target: "/bots/sendBot/"

      - name: Restart Systemd Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 9049
          script: |
            chmod +x /bots/sendBot/bot
            if [ -f /etc/systemd/system/sendBot.service ] && grep -q "java" /etc/systemd/system/sendBot.service 2>/dev/null; then
              sudo sed -i 's|ExecStart=.*|ExecStart=/bots/sendBot/bot|' /etc/systemd/system/sendBot.service
              sudo systemctl daemon-reload
            fi
            sudo systemctl restart sendBot
